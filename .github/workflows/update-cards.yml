name: Update Riftbound card data

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 6am UTC
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest card data
        run: node scripts/fetch-cards.js

      - name: Commit updated data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cards.json
          git diff --staged --quiet || git commit -m "Update Riftbound card data"
          git push
